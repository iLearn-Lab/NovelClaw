name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: node --test tests/live_runtime.test.cjs
      - name: Parse application JavaScript
        run: python scripts/check-javascript.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser-smoke.py
      - name: Validate Docker configuration
        run: |
          cp .env.auth-portal.example apps/auth-portal/.env
          cp .env.multiagent.example apps/multiagent/.env
          cp .env.novelclaw.example apps/novelclaw/.env
          docker compose config --quiet
          bash -n docker-start.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -t novelclaw:local .
      - name: Generate chapters using the packaged workers
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" novelclaw:local python /app/scripts/generation-smoke.py
      - name: Start all container services and verify the shared session
        run: |
          cp .env.auth-portal.example apps/auth-portal/.env
          cp .env.multiagent.example apps/multiagent/.env
          cp .env.novelclaw.example apps/novelclaw/.env
          docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error --location --cookie-jar "$RUNNER_TEMP/session" --cookie "$RUNNER_TEMP/session" http://127.0.0.1:8010/mode-b --output /dev/null
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
